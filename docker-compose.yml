services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/python:3.12-slim}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.aliyun.com/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://mirrors.aliyun.com/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      UPLOAD_DIR: /app/uploads
      OUTPUT_DIR: /app/output
    volumes:
      - ${APP_DATA_DIR:-./.deploy-data}/backend/data:/app/data
      - ${APP_DATA_DIR:-./.deploy-data}/backend/uploads:/app/uploads
      - ${APP_DATA_DIR:-./.deploy-data}/backend/output:/app/output
      - ${APP_DATA_DIR:-./.deploy-data}/backend/templates:/app/templates
      - ${APP_DATA_DIR:-./.deploy-data}/backend/paddleocr:/root/.paddleocr
      - ${APP_DATA_DIR:-./.deploy-data}/backend/paddle:/root/.paddle
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/nginx:alpine}
        PNPM_VERSION: ${PNPM_VERSION:-9.15.9}
        VITE_API_BASE_URL: /api/v1
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped
